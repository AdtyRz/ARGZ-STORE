<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARGZ STORE</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Selamat Datang di ARGZ STORE</h1>
        <p>Temukan produk terbaik dengan harga terjangkau!</p>
    </header>
    <main>
        <input type="text" id="searchInput" placeholder="Cari produk..." onkeyup="cariProduk()" style="width: 100%; padding: 10px; margin-bottom: 20px; font-size: 1em; border-radius: 4px; border: 1px solid #ccc;" />
        <section class="product-list" id="productList">
            <article class="product">
                <img src="https://via.placeholder.com/150" alt="Produk 1" />
                <h2>Produk 1</h2>
                <p class="price">Rp 100.000</p>
                <button class="buy-button" onclick="bukaModalProduk('Produk 1', 'Deskripsi lengkap produk 1, termasuk spesifikasi dan keunggulan.')">Beli</button>
            </article>
            <article class="product">
                <img src="https://via.placeholder.com/150" alt="Produk 2" />
                <h2>Produk 2</h2>
                <p class="price">Rp 200.000</p>
                <button class="buy-button" onclick="bukaModalProduk('Produk 2', 'Deskripsi lengkap produk 2, termasuk spesifikasi dan keunggulan.')">Beli</button>
            </article>
            <article class="product">
                <img src="https://via.placeholder.com/150" alt="Produk 3" />
                <h2>Produk 3</h2>
                <p class="price">Rp 300.000</p>
                <button class="buy-button" onclick="bukaModalProduk('Produk 3', 'Deskripsi lengkap produk 3, termasuk spesifikasi dan keunggulan.')">Beli</button>
            </article>
        </section>
        <!-- Shopping cart section removed as per user request -->
    </main>
    <footer>
        <p>© 2024 Toko Kami. By AdtyRz.</p>
    </footer>

    <!-- Modal Produk -->
    <div id="modalProduk" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="tutupModal()">&times;</span>
            <h2 id="modalNamaProduk">Nama Produk</h2>
            <p id="modalDeskripsiProduk">Deskripsi produk akan ditampilkan di sini.</p>
            <div class="modal-buttons">
                <button id="modalBeliButton" class="buy-button">Beli</button>
                <button id="modalWhatsappButton" class="whatsapp-button">Chat WhatsApp</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
